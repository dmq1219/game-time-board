name = "family-hub-gmail-sync"
main = "src/index.js"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# Poll Gmail twice a day (cron is UTC): 15:00 UTC ≈ 8am Pacific, 03:00 UTC ≈ 8pm
# Pacific. GMAIL_QUERY's "newer_than:2d" comfortably covers the gap between runs.
[triggers]
crons = ["0 3,15 * * *"]

# Non-secret config. Secrets (GOOGLE_*, DEEPSEEK_API_KEY, SUPABASE_SERVICE_KEY)
# are set with `wrangler secret put NAME` — never commit them.
[vars]
SUPABASE_URL = "https://vijbxabsbmyeffunzeyw.supabase.co"
DEEPSEEK_MODEL = "deepseek-chat"
# Gmail search applied each run. Tune to your school's senders/keywords.
# Examples: "newer_than:2d label:school", "from:(iusd.org) newer_than:3d"
GMAIL_QUERY = "newer_than:2d (subject:(field trip OR concert OR \"picture day\" OR recital OR \"parent teacher\" OR permission OR \"school\" OR registration OR rehearsal OR performance OR clearance OR \"preview day\") OR from:(iusd.org OR .edu))"
# Max messages to scan per run (keeps each invocation fast and cheap).
MAX_MESSAGES = "15"
